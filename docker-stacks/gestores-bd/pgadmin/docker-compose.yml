name: gestores-bd-pgadmin
services:
  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Copia .env.example a .env y define PGADMIN_PASSWORD}
    ports:
    - "127.0.0.1:8087:80"
    volumes:
    - pgadmin-data:/var/lib/pgadmin
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
volumes:
  pgadmin-data: {}
