name: frameworks-dotnet-entity-framework-postgresql
services:
  app:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /workspace/app
    command: dotnet watch run --urls http://0.0.0.0:8099
    ports:
    - "127.0.0.1:8099:8099"
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=app_dotnet;Username=app_user;Password=${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}
    volumes:
    - ./:/workspace
    - nuget-cache:/root/.nuget/packages
    depends_on:
    - postgres
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app_dotnet
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}
    ports:
    - "127.0.0.1:5455:5432"
    volumes:
    - db-data:/var/lib/postgresql
    restart: unless-stopped
  adminer:
    image: adminer:6.0.1
    depends_on:
    - postgres
    ports:
    - "127.0.0.1:8100:8080"
    restart: unless-stopped
volumes:
  db-data: {}
  nuget-cache: {}
