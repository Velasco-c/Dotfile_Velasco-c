name: frameworks-laravel-mysql
services:
  app:
    image: composer:2
    working_dir: /workspace
    command: sh -c "if [ ! -f artisan ]; then composer create-project laravel/laravel temp-app && cp -R temp-app/. . && rm -rf temp-app; fi; php artisan serve --host=0.0.0.0 --port=8097"
    ports:
    - "127.0.0.1:8097:8097"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: app_laravel
      DB_USERNAME: app_user
      DB_PASSWORD: ${MYSQL_PASSWORD:?Copia .env.example a .env y define MYSQL_PASSWORD}
    volumes:
    - ./:/workspace
    - composer-cache:/tmp/cache
    depends_on:
    - mysql
    restart: unless-stopped
  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: app_laravel
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copia .env.example a .env y define MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copia .env.example a .env y define MYSQL_ROOT_PASSWORD}
    ports:
    - "127.0.0.1:3310:3306"
    volumes:
    - db-data:/var/lib/mysql
    restart: unless-stopped
  phpmyadmin:
    image: phpmyadmin:5.2.3
    depends_on:
    - mysql
    ports:
    - "127.0.0.1:8098:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: app_user
      PMA_PASSWORD: ${MYSQL_PASSWORD:?Copia .env.example a .env y define MYSQL_PASSWORD}
    restart: unless-stopped
volumes:
  db-data: {}
  composer-cache: {}
