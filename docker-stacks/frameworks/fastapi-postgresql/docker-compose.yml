name: frameworks-fastapi-postgresql
services:
  app:
    image: python:3.14-slim
    working_dir: /workspace
    command: sh -c "pip install -r requirements.txt && uvicorn src.main:app --host 0.0.0.0 --port 8002 --reload"
    ports:
    - "127.0.0.1:8002:8002"
    environment:
      POSTGRES_DB: app_fastapi
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}
    volumes:
    - ./:/workspace
    depends_on:
    - postgres
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app_fastapi
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}
    ports:
    - "127.0.0.1:5452:5432"
    volumes:
    - db-data:/var/lib/postgresql
    restart: unless-stopped
  adminer:
    image: adminer:6.0.1
    depends_on:
    - postgres
    ports:
    - "127.0.0.1:8093:8080"
    restart: unless-stopped
volumes:
  db-data: {}
