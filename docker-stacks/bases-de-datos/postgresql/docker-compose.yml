name: bases-de-datos-postgresql
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}
    ports:
    - "127.0.0.1:5433:5432"
    volumes:
    - postgres-data:/var/lib/postgresql
    restart: unless-stopped
volumes:
  postgres-data: {}
