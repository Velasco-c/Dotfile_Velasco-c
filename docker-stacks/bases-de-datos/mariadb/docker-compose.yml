name: bases-de-datos-mariadb
services:
  mariadb:
    image: mariadb:12.3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Copia .env.example a .env y define MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: app_db
      MARIADB_USER: app_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Copia .env.example a .env y define MARIADB_PASSWORD}
    ports:
    - "127.0.0.1:3308:3306"
    volumes:
    - mariadb-data:/var/lib/mysql
    restart: unless-stopped
volumes:
  mariadb-data: {}
