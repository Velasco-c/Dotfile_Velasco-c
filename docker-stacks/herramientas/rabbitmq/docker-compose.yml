name: herramientas-rabbitmq
services:
  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: app_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Copia .env.example a .env y define RABBITMQ_PASSWORD}
    ports:
    - "127.0.0.1:15672:15672"
    volumes:
    - ./:/workspace
    restart: unless-stopped
