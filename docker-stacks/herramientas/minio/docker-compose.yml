name: herramientas-minio
services:
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: app_user
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copia .env.example a .env y define MINIO_ROOT_PASSWORD}
    command: server /data --console-address :9001
    ports:
    - "127.0.0.1:9001:9001"
    volumes:
    - ./:/workspace
    restart: unless-stopped
