name: herramientas-prometheus-grafana
services:
  prometheus:
    image: prom/prometheus:v3.13.0
    ports:
    - "127.0.0.1:9090:9090"
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.0
    ports:
    - "127.0.0.1:3005:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Copia .env.example a .env y define GRAFANA_PASSWORD}
    volumes:
    - grafana-data:/var/lib/grafana
    restart: unless-stopped
volumes:
  grafana-data: {}
