name: automatizacion-n8n
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}
    ports:
    - "127.0.0.1:5440:5432"
    volumes:
    - postgres-data:/var/lib/postgresql
    restart: unless-stopped
  redis:
    image: redis:8.10-alpine
    ports:
    - "127.0.0.1:6381:6379"
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.30.5
    ports:
    - "127.0.0.1:8026:8025"
    restart: unless-stopped
  n8n:
    image: n8nio/n8n:2.42.6
    depends_on:
    - postgres
    - redis
    - mailpit
    ports:
    - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: app_local_key_change_me
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: app
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?Copia .env.example a .env y define N8N_BASIC_AUTH_PASSWORD}
      QUEUE_BULL_REDIS_HOST: redis
      EXECUTIONS_MODE: queue
      N8N_EMAIL_MODE: smtp
      N8N_SMTP_HOST: mailpit
      N8N_SMTP_PORT: 1025
    volumes:
    - n8n-data:/home/node/.n8n
    restart: unless-stopped
  n8n-worker:
    image: n8nio/n8n:2.42.6
    depends_on:
    - n8n
    command: worker
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: app_local_key_change_me
      QUEUE_BULL_REDIS_HOST: redis
      EXECUTIONS_MODE: queue
    restart: unless-stopped
volumes:
  postgres-data: {}
  n8n-data: {}
