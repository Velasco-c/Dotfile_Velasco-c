name: frontend-angular
services:
  app:
    image: node:26-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 4200"
    ports:
    - "127.0.0.1:4200:4200"
    volumes:
    - ./:/workspace
    - node-modules:/workspace/node_modules
    restart: unless-stopped
volumes:
  node-modules: {}
