name: frontend-vue-vite
services:
  app:
    image: node:26-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
    - "127.0.0.1:5174:5174"
    volumes:
    - ./:/workspace
    - node-modules:/workspace/node_modules
    restart: unless-stopped
volumes:
  node-modules: {}
