add_newline = true

format = """
$directory$git_branch$git_status
$character"""

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style) "

[git_branch]
symbol = "󰘬 "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style)) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[nodejs]
symbol = " "
style = "bold green"

[python]
symbol = " "
style = "bold yellow"

[docker_context]
symbol = "󰡨 "
style = "bold blue"

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow)"

