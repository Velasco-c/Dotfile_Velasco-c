[General]

# Background and typography
BgSource="backgrounds/wallpaper.png"
FontFamily="Atkinson Hyperlegible"
FontSize=9
Padding=50
Radius=10
Scale=1

# User picture
UserPictureEnabled=true
UserBorderWidth=5
UserBorderColor="#b4befe"
UserColor="#cdd6f4"

# Login input fields
InputColor="#1e1e2e"
InputTextColor="#cdd6f4"
InputBorderWidth=4
InputBorderColor="#b4befe"
UserPlaceholderText="user"
PassPlaceholderText="password"
HidePassword=true

# Login button
LoginButtonTextColor="#1e1e2e"
LoginButtonText="Login"
LoginButtonColor="#b4befe"

# Popup
PopupColor="#b4befe"
PopupActiveColor="#1e1e2e"
PopupActiveTextColor="#cdd6f4"

# Session and power buttons
SessionButtonColor="#b4befe"
SessionIconColor="#1e1e2e"
PowerButtonColor="#b4befe"
PowerIconColor="#1e1e2e"

# Date and time
DateTimeSpacing=-20

DateColor="#cdd6f4"
DateSize=36
DateIsBold=false
DateOpacity=1.0
DateFormat="dddd, MMMM d"

TimeColor="#cdd6f4"
TimeSize=48
TimeIsBold=true
TimeOpacity=1.0
TimeFormat="hh:mm AP"
