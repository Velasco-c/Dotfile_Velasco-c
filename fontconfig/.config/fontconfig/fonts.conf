<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fuente monoespaciada por defecto para apps que usan "monospace".
     Requiere: ttf-jetbrains-mono y ttf-nerd-fonts-symbols (ver pkgs/apps.txt).
     Después de instalar o cambiar esto: fc-cache -fv -->
<fontconfig>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Symbols Nerd Font Mono</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
