# ═══════════════════════════════════════════════════════
# KITTY — Hyprland / CachyOS
# ═══════════════════════════════════════════════════════

# ─── Fuente ────────────────────────────────────────────
font_family      FiraCode Nerd Font Mono
bold_font        FiraCode Nerd Font Mono
italic_font      FiraCode Nerd Font Mono
bold_italic_font FiraCode Nerd Font Mono

font_size 14.5

# ─── Ventana ───────────────────────────────────────────
window_padding_width 12
background_opacity 1

# Hyprland se encarga del blur
dynamic_background_opacity yes

# ─── Cursor ────────────────────────────────────────────
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15

# ─── Scroll ────────────────────────────────────────────
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ─── Tabs ──────────────────────────────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_font_style bold
inactive_tab_font_style normal

# ─── Comportamiento ────────────────────────────────────
confirm_os_window_close 0
hide_window_decorations yes
remember_window_size no
window_resize_step_cells 5
window_resize_step_lines 5

# ─── Shell ─────────────────────────────────────────────
shell /usr/bin/fish
shell_integration enabled

# ─── Shell ─────────────────────────────────────────────
shell_integration enabled

# ─── Mouse ────────────────────────────────────────────
mouse_hide_wait 3.0
url_style curly

# ─── Colores Catppuccin ────────────────────────────────
foreground              #c6d0f5
background              #111318

cursor                  #babbf1
cursor_text_color       #111318

selection_foreground    #111318
selection_background    #babbf1

# Colores normales
color0  #303446
color1  #e78284
color2  #a6d189
color3  #e5c890
color4  #8caaee
color5  #ca9ee6
color6  #81c8be
color7  #c6d0f5

# Colores brillantes
color8  #626880
color9  #ea999c
color10 #b5e8a6
color11 #f2d5a0
color12 #a4c2f4
color13 #f4b8e4
color14 #99d1db
color15 #d5d8e8

# ─── Rendimiento ───────────────────────────────────────
repaint_delay 10
input_delay 2
sync_to_monitor yes

# ─── Ligaduras ─────────────────────────────────────────
disable_ligatures never

# ─── Integración con Noctalia ──────────────────────────
include themes/noctalia.conf
